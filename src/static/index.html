<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CryptoLayer Web UI</title>
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #141414;
    --bg3: #1e1e1e;
    --bg4: #2a2a2a;
    --fg: #e4e6eb;
    --fg2: #9aa0a8;
    --fg3: #5c626b;
    --accent: #4a9eff;
    --accent2: #2d7dd2;
    --success: #10b981;
    --error: #ef4444;
    --warning: #f59e0b;
    --border: #2c2c2c;
    --bubble-out: #397304;
    --bubble-in: #244A79;
    --scrollbar-track: #141414;
    --scrollbar-thumb: #3a3a3a;
    --scrollbar-thumb-hover: #4a4a4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }

  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  *::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 6px;
    border: 2px solid var(--scrollbar-track);
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
  * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }

  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 22px; height: 22px; display: block; }
  .brand h1 { font-size: 16px; font-weight: 600; }
  .conn-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 6px;
    background: var(--bg3);
    color: var(--fg3);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .conn-status.ok {
    color: var(--success);
    background: rgba(16, 185, 129, 0.1);
    border-color: rgba(16, 185, 129, 0.3);
  }
  .conn-status.err {
    color: var(--error);
    background: rgba(239, 68, 68, 0.1);
    border-color: rgba(239, 68, 68, 0.3);
  }
  .conn-status svg { width: 14px; height: 14px; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: minmax(0, 1fr);
    min-height: 0;
    overflow: hidden;
  }

  .sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .sidebar-section { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-section h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--fg3); margin-bottom: 10px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .sidebar-section h2 svg { width: 14px; height: 14px; opacity: 0.7; }

  .form-row { margin-bottom: 10px; }
  .form-row label { display: block; font-size: 12px; color: var(--fg2); margin-bottom: 4px; }
  input[type="text"], input[type="password"], textarea, select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 50px; font-family: "SF Mono", Consolas, monospace; font-size: 11px; }

  .btn {
    background: var(--accent); color: white; border: none;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: background 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn:hover { background: var(--accent2); }
  .btn:disabled { background: var(--bg4); color: var(--fg3); cursor: not-allowed; }
  .btn.secondary { background: var(--bg4); }
  .btn.secondary:hover { background: #383838; }
  .btn.danger { background: var(--error); }
  .btn.danger:hover { background: #dc2626; }
  .btn.success { background: var(--success); }
  .btn.success:hover { background: #059669; }
  .btn-group { display: flex; gap: 8px; }

  .status-line {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: var(--bg3); border-radius: 6px;
    margin-bottom: 6px; font-size: 12px;
  }
  .status-line.success { background: rgba(16,185,129,.12); color: var(--success); }
  .status-line.error { background: rgba(239,68,68,.12); color: var(--error); }

  .status-log { max-height: 260px; overflow-y: auto; background: var(--bg); border-radius: 6px; padding: 8px 12px; }
  .status-item { font-size: 12px; padding: 4px 0; color: var(--fg2); border-bottom: 1px solid var(--bg3); }
  .status-item:last-child { border-bottom: none; }
  .status-item .stage { color: var(--accent); font-weight: 500; }
  .status-item.success { color: var(--success); }
  .status-item.error { color: var(--error); }

  .chat {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--bg);
  }
  .chat-header {
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .chat-header .info { font-size: 13px; color: var(--fg2); display: flex; align-items: center; gap: 6px; }
  .chat-header .info svg { width: 16px; height: 16px; opacity: 0.8; }
  .chat-header .node-id { font-family: "SF Mono", Consolas, monospace; font-size: 11px; color: var(--fg3); }

  .chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .message {
    max-width: 70%; padding: 10px 14px; border-radius: 14px;
    word-wrap: break-word; line-height: 1.4; color: #fff;
  }
  .message.in {
    background: var(--bubble-in);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .message.out {
    background: var(--bubble-out);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .message code {
    background: rgba(0,0,0,0.25);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
  }
  .message pre {
    background: rgba(0,0,0,0.25);
    padding: 8px 10px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 4px 0;
    font-size: 12px;
  }
  .message pre code {
    background: none;
    padding: 0;
    font-size: 12px;
  }
  .message a {
    color: #a8d4ff;
    text-decoration: underline;
    word-break: break-all;
  }
  .message a:hover { color: #c8e4ff; }
  .message strong { font-weight: 700; }
  .message em { font-style: italic; }
  .message u { text-decoration: underline; }
  .message del { opacity: 0.7; }
  .message h1, .message h2, .message h3 {
    font-weight: 700;
    margin: 0.3em 0 0.15em 0;
    line-height: 1.25;
  }
  .message h1 { font-size: 1.4em; border-bottom: 1px solid rgba(255,255,255,.25); padding-bottom: 0.1em; }
  .message h2 { font-size: 1.2em; border-bottom: 1px solid rgba(255,255,255,.2); padding-bottom: 0.1em; }
  .message h3 { font-size: 1.05em; }
  .message blockquote {
    border-left: 3px solid rgba(255,255,255,.5);
    padding: 2px 10px;
    margin: 4px 0;
    opacity: 0.9;
  }
  .message ul, .message ol { margin: 4px 0 4px 1.4em; }
  .message li { margin: 1px 0; }
  .message hr {
    border: none;
    height: 1px;
    background: rgba(255,255,255,.3);
    margin: 6px 0;
  }
  .message table {
    border-collapse: collapse;
    margin: 4px 0;
    font-size: 12px;
  }
  .message th, .message td {
    border: 1px solid rgba(255,255,255,.3);
    padding: 3px 8px;
    text-align: left;
  }
  .message th { background: rgba(0,0,0,0.2); font-weight: 700; }
  .message .meta { font-size: 10px; color: rgba(255,255,255,.65); margin-top: 4px; }
  .message .meta code,
  .message .meta pre,
  .message .meta a { font-size: 10px; }
  .message.out .meta { text-align: right; }

  .chat-input {
    padding: 14px 20px; background: var(--bg2);
    border-top: 1px solid var(--border); display: flex; gap: 10px;
    flex-shrink: 0;
    align-items: flex-end;
  }
  .chat-input textarea {
    flex: 1;
    resize: none;
    min-height: 34px;
    max-height: 140px;
    height: 34px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    overflow-y: auto;
    padding: 5px 12px;
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.75);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--bg2); border-radius: 6px; padding: 24px;
    min-width: 400px; max-width: 90vw; max-height: 90vh; overflow-y: auto;
    border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal h3 { margin-bottom: 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .modal h3 svg { width: 18px; height: 18px; }
  .modal p { color: var(--fg2); margin-bottom: 14px; line-height: 1.5; }
  .modal .prompt {
    background: var(--bg3); padding: 12px; border-radius: 6px;
    font-family: "SF Mono", Consolas, monospace; font-size: 12px;
    margin-bottom: 14px; word-break: break-all;
  }
  .modal input { margin-bottom: 14px; }

  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--bg2); border: 1px solid var(--border);
    padding: 12px 16px; border-radius: 8px; z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    display: flex; align-items: center; gap: 8px;
    max-width: calc(100vw - 40px);
  }
  .toast svg { width: 16px; height: 16px; }
  .toast.error { border-color: var(--error); color: var(--error); }
  .toast.success { border-color: var(--success); color: var(--success); }

  .known-nodes { max-height: 150px; overflow-y: auto; }
  .known-node {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px; background: var(--bg3); border-radius: 6px; margin-bottom: 4px;
    font-size: 12px; font-family: "SF Mono", Consolas, monospace;
  }
  .known-node button {
    padding: 3px 8px; font-size: 11px; background: var(--error);
    color: white; border: none; border-radius: 4px; cursor: pointer;
    display: inline-flex; align-items: center;
    flex-shrink: 0;
  }
  .known-node button svg { width: 12px; height: 12px; }

  .empty-state { text-align: center; color: var(--fg3); padding: 20px; font-size: 13px; }

  .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .pass-wrap { position: relative; }
  .pass-wrap input[type="password"],
  .pass-wrap input[type="text"] { padding-right: 36px; }
  .pass-eye {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--fg3); cursor: pointer;
    padding: 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    transition: color 0.15s;
  }
  .pass-eye:hover { color: var(--fg2); }
  .pass-eye svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pass-eye .eye-open { display: none; }
  .pass-eye.revealed .eye-closed { display: none; }
  .pass-eye.revealed .eye-open { display: block; }

  .chat-header-right { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    background: var(--bg4); border: 1px solid var(--border); color: var(--fg2);
    width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--fg); border-color: var(--fg3); }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .settings-modal {
    background: var(--bg2); border-radius: 6px;
    width: 600px; height: 400px;
    border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: flex; overflow: hidden;
  }
  .settings-sidebar {
    width: 180px; background: var(--bg3); border-right: 1px solid var(--border);
    padding: 20px 0; display: flex; flex-direction: column;
  }
  .settings-tab {
    padding: 12px 20px; background: none; border: none; border-left: 3px solid transparent;
    color: var(--fg2); cursor: pointer; font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 8px; transition: all 0.15s;
    font-family: inherit; text-align: left;
  }
  .settings-tab:hover { background: var(--bg4); color: var(--fg); }
  .settings-tab.active { background: var(--bg2); color: var(--accent); border-left-color: var(--accent); }
  .settings-tab svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .settings-content {
    flex: 1; padding: 24px; display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .settings-content h3 {
    margin-bottom: 20px; font-size: 16px; display: flex; align-items: center; gap: 8px;
  }
  .settings-pane { display: none; }
  .settings-pane.active { display: block; }
  .settings-group { margin-bottom: 20px; }
  .settings-group label {
    display: block; font-size: 12px; color: var(--fg2); margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  }
  .settings-group select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    cursor: pointer;
  }
  .settings-group select:focus { border-color: var(--accent); }
  .settings-close {
    background: var(--bg4); border: none; color: var(--fg2); cursor: pointer;
    padding: 8px; border-radius: 6px; margin-left: auto; display: flex;
    transition: all 0.15s;
  }
  .settings-close:hover { color: var(--error); }
  .settings-close svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .emoji-wrap { position: relative; display: flex; flex-shrink: 0; }
  .emoji-pop {
    position: absolute; bottom: calc(100% + 8px); right: 0;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; width: 260px; max-height: 180px; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 50;
    display: none;
  }
  .emoji-wrap.open .emoji-pop { display: block; }
  .emoji-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  .emoji-grid button {
    background: none; border: none; font-size: 22px; padding: 8px;
    cursor: pointer; border-radius: 6px; transition: background 0.1s;
    line-height: 1;
  }
  .emoji-grid button:hover { background: var(--bg4); }

  .format-pop {
    position: absolute;
    z-index: 60;
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .format-pop.open { display: flex; }

  .fmt-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: background 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 28px;
    height: 28px;
  }
  .fmt-btn:hover { background: var(--accent2); }
  .fmt-btn.secondary { background: var(--bg4); color: var(--fg); }
  .fmt-btn.secondary:hover { background: #383838; }
  .fmt-btn.secondary.on {
    background: var(--accent2);
    color: #fff;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .fmt-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .fmt-btn .h-num {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 10px;
    font-weight: 700;
  }

  .fmt-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    padding: 4px 6px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    flex-shrink: 0;
  }

  .fmt-editor-wrap {
    display: flex;
    flex: 1;
    min-height: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  #fmtEditor {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 12px 26px 12px;
    outline: none;
    line-height: 1.6;
    color: var(--fg);
    caret-color: var(--accent);
  }
  #fmtEditor:empty::before {
    content: attr(data-placeholder);
    color: var(--fg3);
    pointer-events: none;
  }
  #fmtEditor ::selection { background: rgba(74,158,255,0.35); }
  #fmtEditor h1, #fmtEditor h2, #fmtEditor h3, #fmtEditor h4, #fmtEditor h5, #fmtEditor h6 {
    margin: 0.5em 0 0.2em 0;
    font-weight: 600;
    color: var(--fg);
  }
  #fmtEditor h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: 0.1em; }
  #fmtEditor h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.1em; }
  #fmtEditor h3 { font-size: 1.2em; }
  #fmtEditor p { margin: 0 0 0.4em 0; }
  #fmtEditor b, #fmtEditor strong { font-weight: 700; }
  #fmtEditor i, #fmtEditor em { font-style: italic; }
  #fmtEditor u { text-decoration: underline; }
  #fmtEditor s, #fmtEditor strike, #fmtEditor del { opacity: 0.7; text-decoration: line-through; }
  #fmtEditor code {
    background: rgba(0,0,0,0.3);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 0.9em;
    color: #f0b0b0;
  }
  #fmtEditor pre {
    background: rgba(0,0,0,0.35);
    padding: 8px 10px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 0.4em 0;
    border: 1px solid var(--border);
    font-family: "SF Mono", Consolas, monospace;
    font-size: 0.9em;
    color: #c0d0e0;
    white-space: pre-wrap;
  }
  #fmtEditor a { color: #a8d4ff; text-decoration: underline; word-break: break-all; }
  #fmtEditor a:hover { color: #c8e4ff; }
  #fmtEditor table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.4em 0;
    font-size: 0.95em;
    table-layout: fixed;
  }
  #fmtEditor th, #fmtEditor td {
    border: 1px solid var(--border);
    padding: 4px 8px;
    text-align: left;
    min-width: 24px;
    overflow-wrap: break-word;
  }
  #fmtEditor th { background: var(--bg3); font-weight: 600; }
  #fmtEditor tr:nth-child(even) { background: var(--bg2); }
  #fmtEditor ul, #fmtEditor ol { margin: 0.3em 0 0.4em 1.6em; }
  #fmtEditor li { margin-bottom: 0.1em; }
  #fmtEditor hr {
    border: none;
    height: 1px;
    background: var(--border);
    margin: 0.6em 0;
  }
  #fmtEditor blockquote {
    border-left: 4px solid var(--accent);
    background: var(--bg3);
    padding: 4px 12px;
    margin: 0.4em 0;
    border-radius: 0 6px 6px 0;
    color: var(--fg2);
  }

  .fmt-tbl-tool {
    position: fixed;
    z-index: 130;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg4);
    color: var(--fg2);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .fmt-tbl-tool.show { display: flex; }
  .fmt-tbl-tool:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fmt-tbl-tool.minus:hover { background: var(--error); border-color: var(--error); }

  .fmt-tbl-picker {
    position: fixed;
    z-index: 120;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .fmt-tbl-picker.show { display: block; }
  .fmt-tbl-grid {
    display: grid;
    grid-template-columns: repeat(10, 18px);
    gap: 3px;
  }
  .fmt-tbl-cell {
    width: 18px;
    height: 18px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--bg3);
    cursor: pointer;
  }
  .fmt-tbl-cell.hl {
    background: rgba(74,158,255,0.25);
    border-color: var(--accent);
  }
  .fmt-tbl-label {
    text-align: center;
    margin-top: 6px;
    font-size: 12px;
    color: var(--fg2);
  }

  .fmt-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 140;
  }
  .fmt-modal-backdrop.show { display: flex; }
  .fmt-modal {
    width: 320px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,.6);
  }
  .fmt-modal-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .fmt-modal input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    color: var(--fg);
    font-size: 13px;
    outline: none;
    font-family: "SF Mono", Consolas, monospace;
  }
  .fmt-modal input:focus { border-color: var(--accent); }
  .fmt-modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }

  html[data-theme="light"] {
    --bg: #f5f7fa;
    --bg2: #ffffff;
    --bg3: #f0f2f5;
    --bg4: #e4e7eb;
    --fg: #1a1d21;
    --fg2: #5c626b;
    --fg3: #8a9098;
    --border: #d8dde3;
    --bubble-out: #397304;
    --bubble-in: #244A79;
    --scrollbar-track: #f0f2f5;
    --scrollbar-thumb: #c0c5cc;
    --scrollbar-thumb-hover: #a8aeb5;
  }

  .burger-btn { display: none; }
  .sidebar-backdrop { display: none; }
  .sidebar-header-mobile { display: none; }

  @media (max-width: 768px) {
    html, body { font-size: 13px; }

    header { padding: 8px 12px; }
    .brand h1 { font-size: 14px; }
    .brand img { width: 18px; height: 18px; }
    .brand { gap: 6px; }
    .conn-status { font-size: 10px; padding: 4px 8px; gap: 4px; }
    .conn-status svg { width: 12px; height: 12px; }

    main {
      grid-template-columns: 1fr;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      height: 100dvh;
      width: 85vw;
      max-width: 320px;
      transform: translateX(-100%);
      transition: transform 0.28s cubic-bezier(.4,.0,.2,1);
      z-index: 150;
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 149;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      display: block;
    }
    body.sidebar-open .sidebar {
      transform: translateX(0);
    }
    body.sidebar-open .sidebar-backdrop {
      opacity: 1;
      pointer-events: auto;
    }
    body.sidebar-open {
      overflow: hidden;
    }

    .burger-btn {
      display: inline-flex;
    }

    .sidebar-header-mobile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .sidebar-header-mobile .brand {
      gap: 8px;
    }
    .sidebar-header-mobile .brand h1 {
      font-size: 14px;
    }
    .sidebar-header-mobile .brand img {
      width: 18px;
      height: 18px;
    }
    .sidebar-header-mobile .icon-btn {
      width: 30px;
      height: 30px;
    }
    .sidebar-header-mobile .icon-btn svg {
      width: 16px;
      height: 16px;
    }

    .sidebar-section { padding: 12px 16px; }
    .sidebar-section h2 { font-size: 11px; margin-bottom: 8px; }
    .form-row { margin-bottom: 8px; }
    .form-row label { font-size: 11px; margin-bottom: 3px; }
    input[type="text"], input[type="password"], textarea, select {
      padding: 7px 9px;
      font-size: 13px;
    }

    .chat-header { padding: 10px 12px; gap: 8px; }
    .chat-header .info { font-size: 12px; gap: 4px; }
    .chat-header .info svg { width: 14px; height: 14px; }
    .chat-header .node-id { font-size: 10px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-header-right { gap: 6px; flex-shrink: 0; }
    #cryptoBadge { font-size: 10px; padding: 4px 7px; margin-bottom: 0; display: none; }
    .icon-btn { width: 32px; height: 32px; flex-shrink: 0; }
    .icon-btn svg { width: 16px; height: 16px; }
    .chat-messages { padding: 12px; gap: 8px; }
    .chat-input { padding: 10px 12px; gap: 6px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .chat-input textarea { font-size: 14px; padding: 6px 10px; min-height: 36px; height: 36px; }

    .message { max-width: 85%; padding: 8px 12px; font-size: 14px; }

    .btn { padding: 7px 10px; font-size: 12px; gap: 4px; }
    .btn svg { width: 12px; height: 12px; }
    .btn-group { gap: 6px; }
    .btn-group .btn { flex: 1; justify-content: center; }

    .modal {
      min-width: auto;
      width: 92vw;
      padding: 16px;
    }
    .modal h3 { font-size: 14px; margin-bottom: 10px; }
    .modal p { font-size: 13px; margin-bottom: 12px; }
    .modal .prompt { padding: 10px; font-size: 11px; }

    .settings-modal {
      width: 95vw;
      height: 85vh;
      flex-direction: column;
    }
    .settings-sidebar {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      padding: 6px 0;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .settings-tab {
      white-space: nowrap;
      border-left: none;
      border-bottom: 3px solid transparent;
      padding: 8px 14px;
      font-size: 12px;
    }
    .settings-tab.active {
      border-left-color: transparent;
      border-bottom-color: var(--accent);
    }
    .settings-content {
      padding: 16px;
      overflow-y: auto;
    }
    .settings-content h3 { font-size: 14px; margin-bottom: 14px; }

    .toast {
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      max-width: none;
      font-size: 12px;
      padding: 10px 12px;
    }

    .fmt-btn { padding: 4px 8px; font-size: 11px; height: 26px; min-width: 26px; }
    .fmt-toolbar { gap: 2px; padding: 3px 4px; }
    .fmt-tbl-picker { max-width: 95vw; overflow-x: auto; }
    .fmt-modal { width: 92vw; max-width: 320px; }

    .status-log { max-height: 180px; }
    .known-nodes { max-height: 120px; }

    .pass-eye { right: 2px; padding: 4px; }

    .known-node { padding: 6px 8px; font-size: 11px; }
    .known-node button { padding: 2px 6px; font-size: 10px; }

    .emoji-pop {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(65px + env(safe-area-inset-bottom));
      width: auto;
      max-height: 200px;
      padding: 8px;
    }
    .emoji-grid button { font-size: 20px; padding: 6px; }
  }

  @media (max-width: 400px) {
    header { padding: 6px 10px; }
    .brand h1 { font-size: 13px; }
    .conn-status { font-size: 9px; padding: 3px 6px; }
    .conn-status svg { display: none; }
    .chat-input { padding: 8px 10px; gap: 4px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
    .chat-input textarea { font-size: 13px; padding: 5px 8px; }
    .btn { padding: 6px 8px; font-size: 11px; }
    .message { font-size: 13px; padding: 7px 10px; }
    .chat-header { padding: 8px 10px; }
    .chat-header-right { gap: 4px; }
    .icon-btn { width: 30px; height: 30px; }
    .icon-btn svg { width: 14px; height: 14px; }
    .emoji-pop { left: 8px; right: 8px; bottom: calc(61px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="images/logo.svg" alt="logo" id="logoImg">
    <h1>CryptoLayer Web UI</h1>
  </div>
  <div id="wsStatus" class="conn-status">
    <svg class="icon" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    <span id="wsStatusText">Подключение к серверу...</span>
  </div>
</header>

<main>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header-mobile">
      <div class="brand">
        <img src="images/logo.svg" alt="logo" class="logoImgMobile">
        <h1>CryptoLayer</h1>
      </div>
      <button type="button" class="icon-btn" id="closeSidebarBtn" title="Закрыть">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="sidebar-section">
      <h2>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        Инициализация
      </h2>

      <div class="form-row">
        <label>Модуль транспорта</label>
        <select id="moduleSelect"></select>
      </div>

      <div id="credsContainer"></div>

      <div class="form-row" id="userIdRow" style="display:none;">
        <label>ID собеседника в канале связи (user_id)</label>
        <input type="text" id="companionUserId" placeholder="Например: 123456789">
      </div>

      <div class="form-row">
        <label>Пароль</label>
        <div class="pass-wrap">
          <input type="password" id="password" value="123456">
          <button type="button" class="pass-eye" id="passEye" title="Показать/скрыть пароль">
            <svg class="eye-closed" viewBox="0 0 24 24">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
            <svg class="eye-open" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-row">
        <label>Директория данных</label>
        <input type="text" id="dataDir" value="./data/node_a">
      </div>
      <div class="form-row">
        <label>WordCoder словарь (JSON, опционально)</label>
        <textarea id="wordcoderDict" placeholder='{"00":"zero","01":"one",...}'></textarea>
      </div>
      <div class="btn-group">
        <button class="btn" id="initBtn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
          Init
        </button>
        <button class="btn danger" id="stopBtn">
          <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
          Stop
        </button>
      </div>
    </div>

    <div class="sidebar-section">
      <h2>
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Текущий статус
      </h2>
      <div id="currentStatus"><div class="empty-state">Не инициализировано</div></div>
    </div>

    <div class="sidebar-section">
      <h2>
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2 1.5-3.5 4-3.5"/></svg>
        Известные узлы
      </h2>
      <div id="knownNodes" class="known-nodes"><div class="empty-state">Нет данных</div></div>
      <button class="btn secondary" id="refreshNodesBtn" style="margin-top:8px;width:100%;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        Обновить
      </button>
    </div>

    <div class="sidebar-section">
      <h2>
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Журнал статусов
      </h2>
      <div id="statusLog" class="status-log"></div>
    </div>

  </aside>

  <section class="chat">
    <div class="chat-header">
      <button type="button" class="icon-btn burger-btn" id="burgerBtn" title="Меню">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div style="flex:1;min-width:0;">
        <div class="info">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Чат
        </div>
        <div class="node-id" id="companionInfo">Собеседник не подключен</div>
      </div>
      <div class="chat-header-right">
        <button type="button" class="icon-btn" id="settingsBtn" title="Настройки">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <div id="cryptoBadge" class="status-line" style="margin-bottom:0;">not initialized</div>
      </div>
    </div>
    <div id="messages" class="chat-messages">
      <div class="empty-state">Сообщений пока нет</div>
    </div>
    <div class="chat-input">
      <textarea id="msgInput" placeholder="Введите сообщение..." disabled rows="1"></textarea>
      <button type="button" class="icon-btn" id="formatBtn" title="Форматирование">
        <svg viewBox="0 0 24 24">
          <path d="M3.5 15.5 7 5.5h.5l3.5 10"/>
          <path d="M5.2 11.5h4.6"/>
          <path d="M3 19h9"/>
          <path d="M14.5 18.5l.9-3.1 4.6-4.6 2.2 2.2-4.6 4.6-3.1.9z"/>
        </svg>
      </button>
      <div class="emoji-wrap" id="emojiWrap">
        <button type="button" class="icon-btn" id="emojiBtn" title="Эмодзи">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>
        </button>
        <div class="emoji-pop" id="emojiPop">
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
      </div>
      <button class="btn" id="sendBtn" disabled>
        <svg class="icon" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        Отправить
      </button>
    </div>

    <div class="format-pop" id="formatPop">
      <div class="fmt-toolbar">
        <button class="fmt-btn secondary" data-cmd="bold" title="Полужирный (Ctrl+B)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 12a4 4 0 0 0 0-8H6v8"/><path d="M15 20a4 4 0 0 0 0-8H6v8Z"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="italic" title="Курсив (Ctrl+I)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="underline" title="Подчёркнутый (Ctrl+U)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="4" y1="20" x2="20" y2="20"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="strike" title="Зачёркнутый">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="code" title="Инлайн-код">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="link" title="Ссылка (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="codeblock" title="Блок кода">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="m10 10-2.5 2.5L10 15"/><path d="m14 10 2.5 2.5L14 15"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="ul" title="Маркированный список">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="ol" title="Нумерованный список">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="table" title="Таблица">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9.5h18M9.5 9.5v10M15.5 9.5v10"/></svg>
        </button>
        <button class="fmt-btn secondary" data-cmd="hr" title="Разделитель">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>

function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>');
  const stash = [];
  const put = (s) => { stash.push(s); return '\x00S' + (stash.length - 1) + '\x00'; };
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => put('<pre><code>' + code + '</code></pre>'));
  html = html.replace(/`([^`\n]+)`/g, (m, code) => put('<code>' + code + '</code>'));
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, url) => {
    if (/^javascript:/i.test(url.trim())) return m;
    return put('<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>');
  });
  html = html.replace(/([^\n])\s+(#{1,3}\s)/g, '$1\n$2');
  html = html.replace(/([^\n])\s+(-\s+)/g, '$1\n$2');
  html = html.replace(/([^\n])\s+(&gt;\s)/g, '$1\n$2');
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
  html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
  html = html.replace(/(?<!\w)_([^_\n]+)_(?!\w)/g, '<em>$1</em>');
  html = html.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  html = html.replace(/(^|\n)&gt;\s?([^\n]*)/g, '$1<blockquote>$2</blockquote>');
  html = html.replace(/(^|\n)###\s+([^\n]+)/g, '$1<h3>$2</h3>');
  html = html.replace(/(^|\n)##\s+([^\n]+)/g, '$1<h2>$2</h2>');
  html = html.replace(/(^|\n)#\s+([^\n]+)/g, '$1<h1>$2</h1>');
  html = html.replace(/(^|\n)---+\s*$/gm, '$1<hr>');
  html = html.replace(/(^|\n)-\s+([^\n]+)/g, '$1<li class="ul">$2</li>');
  html = html.replace(/(^|\n)\d+\.\s+([^\n]+)/g, '$1<li class="ol">$2</li>');
  html = html.replace(/((?:<li class="ul">[^\n]*<\/li>\n?)+)/g, '<ul>$1</ul>');
  html = html.replace(/((?:<li class="ol">[^\n]*<\/li>\n?)+)/g, '<ol>$1</ol>');
  html = html.replace(/<li class="ul">/g, '<li>');
  html = html.replace(/<li class="ol">/g, '<li>');
  html = html.replace(/((?:^\|[^\n]*\|\n?)+)/gm, (block) => {
    const lines = block.trim().split('\n');
    if (lines.length < 2) return block;
    if (!/^\|?[\s:|-]+\|?$/.test(lines[1]) || lines[1].indexOf('-') === -1) return block;
    const row = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    let out = '<table><thead><tr>' + row(lines[0]).map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
    for (let i = 2; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      out += '<tr>' + row(lines[i]).map(c => '<td>' + c + '</td>').join('') + '</tr>';
    }
    return out + '</tbody></table>';
  });
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/\x00S(\d+)\x00/g, (m, i) => stash[parseInt(i)]);
  return html;
}

function htmlToMarkdown(root) {
  function cellText(node) {
    let out = '';
    node.childNodes.forEach(c => { out += walk(c); });
    return out.replace(/\|/g, '\\|').replace(/\n/g, ' ').trim();
  }
  function tableToMd(tbl) {
    const rows = tbl.querySelectorAll('tr');
    if (!rows.length) return '';
    const matrix = [];
    rows.forEach(tr => {
      const cells = tr.querySelectorAll('th,td');
      const row = [];
      cells.forEach(td => row.push(cellText(td)));
      matrix.push(row);
    });
    const cols = Math.max.apply(null, matrix.map(r => r.length)) || 1;
    matrix.forEach(r => { while (r.length < cols) r.push(''); });
    const lines = [];
    lines.push('| ' + matrix[0].join(' | ') + ' |');
    lines.push('| ' + Array(cols).fill('---').join(' | ') + ' |');
    for (let i = 1; i < matrix.length; i++) {
      lines.push('| ' + matrix[i].join(' | ') + ' |');
    }
    return lines.join('\n');
  }
  function walk(node) {
    if (node.nodeType === 3) return node.textContent;
    if (node.nodeType !== 1) return '';
    const tag = node.tagName.toLowerCase();
    if (tag === 'br') return '\n';
    if (tag === 'hr') return '\n---\n';
    if (tag === 'script' || tag === 'style') return '';
    if (tag === 'table') return '\n' + tableToMd(node) + '\n';
    if (tag === 'thead' || tag === 'tbody' || tag === 'tfoot' || tag === 'tr') {
      let out = '';
      node.childNodes.forEach(c => { out += walk(c); });
      return out;
    }
    if (tag === 'th' || tag === 'td') return '';
    if (tag === 'pre') {
      const codeEl = node.querySelector('code');
      const code = codeEl ? codeEl.textContent : node.textContent;
      return '\n```\n' + code.replace(/\n+$/, '') + '\n```\n';
    }
    if (tag === 'code') {
      const t = node.textContent;
      if (t.indexOf('\n') !== -1) return t;
      return '`' + t + '`';
    }
    if (tag === 'a') {
      const href = node.getAttribute('href') || '';
      const inner = collectInline(node);
      if (/^javascript:/i.test(href.trim())) return inner;
      return '[' + inner + '](' + href + ')';
    }
    if (tag === 'blockquote') {
      const inner = collectBlock(node).replace(/^\n+|\n+$/g, '');
      return '\n' + inner.split('\n').map(l => '> ' + l).join('\n') + '\n';
    }
    if (tag === 'h1') return '\n# ' + collectInline(node) + '\n';
    if (tag === 'h2') return '\n## ' + collectInline(node) + '\n';
    if (tag === 'h3') return '\n### ' + collectInline(node) + '\n';
    if (tag === 'p') return '\n' + collectInline(node) + '\n';
    if (tag === 'ul' || tag === 'ol') {
      let out = '\n';
      let idx = 1;
      node.childNodes.forEach(li => {
        if (li.nodeType === 1 && li.tagName.toLowerCase() === 'li') {
          const prefix = tag === 'ol' ? (idx++ + '. ') : '- ';
          out += prefix + collectInline(li) + '\n';
        }
      });
      return out;
    }
    if (tag === 'li') return collectInline(node);
    if (tag === 'strong' || tag === 'b') return '**' + collectInline(node) + '**';
    if (tag === 'em' || tag === 'i') return '*' + collectInline(node) + '*';
    if (tag === 'u') return '<u>' + collectInline(node) + '</u>';
    if (tag === 's' || tag === 'strike' || tag === 'del') return '~~' + collectInline(node) + '~~';
    let out = '';
    node.childNodes.forEach(c => { out += walk(c); });
    return out;
  }
  function collectInline(node) {
    let out = '';
    node.childNodes.forEach(c => {
      if (c.nodeType === 3) out += c.textContent;
      else if (c.nodeType === 1) out += walk(c);
    });
    return out.replace(/\s+/g, ' ').trim();
  }
  function collectBlock(node) {
    let out = '';
    node.childNodes.forEach(c => { out += walk(c); });
    return out;
  }
  let md = '';
  root.childNodes.forEach(c => { md += walk(c); });
  md = md.replace(/\n{3,}/g, '\n\n').replace(/^\n+|\n+$/g, '');
  return md;
}

function positionFormatPop() {
  const pop = document.getElementById('formatPop');
  const frame = document.getElementById('messages').getBoundingClientRect();
  const chat = document.querySelector('.chat').getBoundingClientRect();
  const isMobile = window.innerWidth <= 768;
  let w, h, left, top;
  if (isMobile) {
    w = Math.round(chat.width * 0.95);
    h = Math.round(chat.height * 0.85);
    left = Math.round(chat.width * 0.025);
    top = Math.round(chat.height * 0.075);
  } else {
    w = Math.round(Math.max(320, Math.min(640, frame.width * 0.405)));
    h = Math.round(Math.min(640, frame.height * 0.866));
    left = Math.round(frame.left - chat.left + (frame.width - w) / 2);
    top = Math.round(frame.top - chat.top + (frame.height - h) / 2);
  }
  pop.style.width = w + 'px';
  pop.style.height = h + 'px';
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

function closeSidebar() {
  document.body.classList.remove('sidebar-open');
}
function toggleSidebar() {
  document.body.classList.toggle('sidebar-open');
}

class CryptoUI {
  constructor() {
    this.ws = null;
    this.pendingRequests = new Map();
    this.modules = [];
    this.lastSentText = null;
    this.lastSentTime = 0;
    this.settings = { theme: 'system' };
    this.bindUI();
    this.connectWS();
    this.loadModules();
    this.loadSettings();
  }

  bindUI() {
    document.getElementById('initBtn').onclick = () => { this.initCrypto(); if (window.innerWidth <= 768) closeSidebar(); };
    document.getElementById('stopBtn').onclick = () => { this.stopCrypto(); if (window.innerWidth <= 768) closeSidebar(); };
    document.getElementById('sendBtn').onclick = () => this.sendMessage();
    document.getElementById('refreshNodesBtn').onclick = () => this.loadKnownNodes();

    document.getElementById('burgerBtn').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);
    document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);

    const msgInput = document.getElementById('msgInput');
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        this.sendMessage();
      }
    });
    msgInput.addEventListener('input', () => {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 140) + 'px';
    });

    document.getElementById('passEye').addEventListener('click', () => {
      const input = document.getElementById('password');
      const eye = document.getElementById('passEye');
      const reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      eye.classList.toggle('revealed', reveal);
      eye.title = reveal ? 'Скрыть пароль' : 'Показать пароль';
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingsModal').style.display = 'flex';
    });
    document.getElementById('closeSettings').addEventListener('click', () => {
      document.getElementById('settingsModal').style.display = 'none';
    });
    document.getElementById('settingsModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('settingsModal')) {
        document.getElementById('settingsModal').style.display = 'none';
      }
    });
    document.getElementById('themeSelect').addEventListener('change', (e) => {
      this.settings.theme = e.target.value;
      this.applySettings();
      this.saveSettings();
    });

    const EMOJIS = ['🥸','😐','😑','😂','🤨','🤪','😭', '🤠', '🤫','🍩','🍪','💀'];
    const grid = document.getElementById('emojiGrid');
    EMOJIS.forEach(ch => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = ch;
      b.addEventListener('click', () => {
        const inp = document.getElementById('msgInput');
        const start = inp.selectionStart ?? inp.value.length;
        const end = inp.selectionEnd ?? start;
        inp.value = inp.value.slice(0, start) + ch + inp.value.slice(end);
        inp.focus();
        inp.selectionStart = inp.selectionEnd = start + ch.length;
        inp.dispatchEvent(new Event('input'));
      });
      grid.appendChild(b);
    });
    document.getElementById('emojiBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('emojiWrap').classList.toggle('open');
    });
    document.getElementById('emojiPop').addEventListener('click', (e) => e.stopPropagation());

    document.getElementById('formatBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      const pop = document.getElementById('formatPop');
      if (!pop.classList.contains('open')) positionFormatPop();
      pop.classList.toggle('open');
    });
    document.getElementById('formatPop').addEventListener('click', (e) => e.stopPropagation());

    document.addEventListener('click', (e) => {
      const wrap = document.getElementById('emojiWrap');
      if (!wrap.contains(e.target)) wrap.classList.remove('open');
      const fpop = document.getElementById('formatPop');
      if (!fpop.contains(e.target) &&
          !e.target.closest('#formatBtn') &&
          !e.target.closest('.fmt-tbl-picker') &&
          !e.target.closest('.fmt-tbl-tool') &&
          !e.target.closest('.fmt-modal-backdrop')) {
        fpop.classList.remove('open');
      }
    });
    window.addEventListener('resize', () => {
      if (document.getElementById('formatPop').classList.contains('open')) positionFormatPop();
    });
  }

  loadSettings() {
    try {
      const raw = localStorage.getItem('cl-settings');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.theme) this.settings.theme = parsed.theme;
      }
    } catch (_) {}
    this.syncSettingsUI();
    this.applySettings();
  }
  saveSettings() {
    try { localStorage.setItem('cl-settings', JSON.stringify(this.settings)); } catch (_) {}
  }
  syncSettingsUI() {
    document.getElementById('themeSelect').value = this.settings.theme;
  }
  applySettings() {
    let theme = this.settings.theme;
    if (theme === 'system') {
      theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');

    const logoImg = document.getElementById('logoImg');
    if (logoImg) {
      logoImg.onload = function() { this.style.display = 'block'; };
      logoImg.onerror = function() { this.style.display = 'none'; };
      const newSrc = theme === 'light' ? 'images/logo_alt.svg' : 'images/logo.svg';
      logoImg.src = newSrc;
    }
    const logoImgMobile = document.querySelector('.logoImgMobile');
    if (logoImgMobile) {
      logoImgMobile.src = theme === 'light' ? 'images/logo_alt.svg' : 'images/logo.svg';
    }
  }

  async loadModules() {
    try {
      const r = await fetch('/api/modules');
      const data = await r.json();
      this.modules = data.items;

      const sel = document.getElementById('moduleSelect');
      sel.innerHTML = this.modules.map(m =>
        `<option value="${m.unique_id}">${escapeHtml(m.name)} — ${escapeHtml(m.description)}</option>`
      ).join('');
      sel.onchange = () => this.renderModuleFields();
      this.renderModuleFields();
    } catch (e) {
      this.showToast('Не удалось загрузить список модулей', 'error');
    }
  }

  renderModuleFields() {
    const sel = document.getElementById('moduleSelect');
    const mod = this.modules.find(m => m.unique_id === sel.value);
    const container = document.getElementById('credsContainer');
    container.innerHTML = '';
    if (!mod) return;

    (mod.credentials || []).forEach((cred) => {
      const entry = Object.entries(cred)[0];
      if (!entry) return;
      const [name, desc] = entry;
      const row = document.createElement('div');
      row.className = 'form-row';
      row.innerHTML = `<label>${escapeHtml(name)} — ${escapeHtml(desc)}</label>`;
      const input = document.createElement('input');
      input.type = 'password';
      input.dataset.cred = name;
      input.placeholder = name;
      row.appendChild(input);
      container.appendChild(row);
    });

    document.getElementById('userIdRow').style.display = mod.is_http ? 'none' : 'block';
  }

  connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    this.ws = new WebSocket(`${proto}//${location.host}/ws`);

    this.ws.onopen = () => {
      const el = document.getElementById('wsStatus');
      el.className = 'conn-status ok';
      document.getElementById('wsStatusText').textContent = 'Связь с сервером установлена';
    };
    this.ws.onclose = () => {
      const el = document.getElementById('wsStatus');
      el.className = 'conn-status err';
      document.getElementById('wsStatusText').textContent = 'Нет связи с сервером — переподключение...';
      setTimeout(() => this.connectWS(), 2000);
    };
    this.ws.onmessage = (ev) => {
      try { this.handleMessage(JSON.parse(ev.data)); } catch (e) {}
    };
  }

  handleMessage(msg) {
    switch (msg.type) {
      case 'bootstrap': this.handleBootstrap(msg); break;
      case 'status': this.addStatus(msg); this.updateCurrentStatus(msg); break;
      case 'message': this.addMessage(msg); break;
      case 'check_signatures': this.showCheckSignaturesModal(msg); break;
      case 'request_data': this.showRequestDataModal(msg); break;
      case 'ready': this.setCryptoReady(true); break;
      case 'disconnect':
        this.setCryptoReady(false);
        this.showToast('Собеседник отключился', 'error');
        break;
      case 'ping_timeout':
        this.showToast('Ping timeout — собеседник не отвечает', 'error');
        break;
    }
  }

  handleBootstrap(data) {
    if (data.init_state && data.init_state.status === 'ready') this.setCryptoReady(true);
    (data.statuses || []).forEach(s => { this.addStatus(s, false); this.updateCurrentStatus(s); });
    (data.history || []).forEach(m => this.addMessage(m, false));
    (data.pending_requests || []).forEach(r => {
      if (r.kind === 'check_signatures') this.showCheckSignaturesModal(r);
      else if (r.kind === 'request_data') this.showRequestDataModal(r);
    });
    this.loadKnownNodes();
    this.loadState();
  }

  async loadState() {
    try {
      const r = await fetch('/api/state');
      const data = await r.json();
      if (data.crypto && data.crypto.companion_node_id) {
        document.getElementById('companionInfo').textContent = `Companion: ${data.crypto.companion_node_id}`;
      }
    } catch (e) {}
  }

  async loadKnownNodes() {
    const container = document.getElementById('knownNodes');
    try {
      const r = await fetch('/api/keys/known-nodes');
      const data = await r.json();
      if (!data.items || data.items.length === 0) {
        container.innerHTML = '<div class="empty-state">Нет известных узлов</div>';
        return;
      }
      container.innerHTML = data.items.map(n => `
        <div class="known-node">
          <span title="${n.node_id}">${n.node_id.substring(0, 16)}...</span>
          <button onclick="ui.deleteKnownNode('${n.node_id}')">${ICONS.x}</button>
        </div>
      `).join('');
    } catch (e) {
      container.innerHTML = '<div class="empty-state">Не загружено</div>';
    }
  }

  async deleteKnownNode(nodeId) {
    if (!confirm('Удалить узел?')) return;
    try {
      await fetch(`/api/keys/known-nodes/${encodeURIComponent(nodeId)}`, { method: 'DELETE' });
      this.loadKnownNodes();
      this.showToast('Узел удалён', 'success');
    } catch (e) {
      this.showToast('Ошибка удаления', 'error');
    }
  }

  addStatus(s, scroll = true) {
    const log = document.getElementById('statusLog');
    const el = document.createElement('div');
    el.className = 'status-item' + (s.status_type === 'success' ? ' success' : s.status_type === 'error' ? ' error' : '');
    const t = new Date(s.ts * 1000).toLocaleTimeString();
    el.innerHTML = `<span class="stage">[${escapeHtml(s.stage)}]</span> ${escapeHtml(s.message)} <small style="color:var(--fg3)">(${t})</small>`;
    log.appendChild(el);
    if (scroll) log.scrollTop = log.scrollHeight;
  }

  updateCurrentStatus(s) {
    const c = document.getElementById('currentStatus');
    c.innerHTML = `<div class="status-line ${s.status_type === 'success' ? 'success' : s.status_type === 'error' ? 'error' : ''}">${escapeHtml(s.stage)}: ${escapeHtml(s.message)}</div>`;
  }

  addMessage(m, scroll = true) {
    if (m.direction !== 'out' && m.text && m.text === this.lastSentText && (Date.now() - this.lastSentTime) < 3000) {
      this.lastSentText = null;
      return;
    }
    const cont = document.getElementById('messages');
    if (cont.querySelector('.empty-state')) cont.innerHTML = '';
    const el = document.createElement('div');
    const isOut = m.direction === 'out';
    el.className = 'message ' + (isOut ? 'out' : 'in');
    const t = new Date((m.timestamp || m.ts || Date.now() / 1000) * 1000).toLocaleTimeString();
    const who = isOut ? 'Вы' : 'Собеседник';
    el.innerHTML = renderMarkdown(m.text) + '<div class="meta">' + escapeHtml(who) + ' · ' + escapeHtml(t) + '</div>';
    cont.appendChild(el);
    if (scroll) cont.scrollTop = cont.scrollHeight;
  }

  setCryptoReady(ready) {
    const badge = document.getElementById('cryptoBadge');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    if (ready) {
      badge.className = 'status-line success';
      badge.textContent = '● Ready';
      msgInput.disabled = false;
      sendBtn.disabled = false;
    } else {
      badge.className = 'status-line';
      badge.textContent = '○ Not ready';
      msgInput.disabled = true;
      sendBtn.disabled = true;
    }
  }

  async initCrypto() {
    const password = document.getElementById('password').value;
    const dataDir = document.getElementById('dataDir').value;
    const moduleId = document.getElementById('moduleSelect').value;
    const userId = document.getElementById('companionUserId').value.trim();

    const credentials = [...document.querySelectorAll('#credsContainer input[data-cred]')]
      .map(i => i.value);

    let wordcoderDict = null;
    const rawDict = document.getElementById('wordcoderDict').value.trim();
    if (rawDict) {
      try { wordcoderDict = JSON.parse(rawDict); }
      catch (e) { this.showToast('Неверный JSON словаря', 'error'); return; }
    }

    try {
      const r = await fetch('/api/init', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          password, data_dir: dataDir, wordcoder_dict: wordcoderDict,
          module_id: moduleId, credentials, companion_user_id: userId || null,
        })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Init failed');
      this.showToast('Инициализация запущена', 'success');
    } catch (e) {
      this.showToast('Ошибка: ' + e.message, 'error');
    }
  }

  async stopCrypto() {
    if (!confirm('Остановить CryptoLayer?')) return;
    try {
      await fetch('/api/stop', { method: 'POST' });
      this.setCryptoReady(false);
      this.showToast('Остановка...', 'success');
    } catch (e) {
      this.showToast('Ошибка', 'error');
    }
  }

  async sendMessage() {
    const fpop = document.getElementById('formatPop');
    const fmtEd = document.getElementById('fmtEditor');
    let text;
    let fromEditor = false;
    if (fpop.classList.contains('open') && fmtEd.textContent.trim().length > 0) {
      text = htmlToMarkdown(fmtEd);
      fromEditor = true;
    } else {
      text = document.getElementById('msgInput').value.trim();
    }
    if (!text) return;

    this.addMessage({ text, direction: 'out', ts: Date.now() / 1000 });
    this.lastSentText = text;
    this.lastSentTime = Date.now();

    if (fromEditor) {
      fmtEd.innerHTML = '';
      fpop.classList.remove('open');
    } else {
      const input = document.getElementById('msgInput');
      input.value = '';
      input.style.height = '34px';
    }

    try {
      const r = await fetch('/api/messages/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (!r.ok) {
        const err = await r.json();
        throw new Error(err.detail);
      }
    } catch (e) {
      this.showToast('Ошибка отправки: ' + e.message, 'error');
    }
  }

  showCheckSignaturesModal(req) {
    if (this.pendingRequests.has(req.request_id)) return;
    this.pendingRequests.set(req.request_id, req);

    const modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
      <div class="modal">
        <h3>${ICONS.shield} Проверка подписи собеседника</h3>
        <p>Сравните подписи по другому каналу связи и подтвердите доверие:</p>
        <div class="prompt">
          <strong>Ваша подпись:</strong> ${escapeHtml(req.meta?.my_sign || '—')}<br>
          <strong>Подпись собеседника:</strong> ${escapeHtml(req.meta?.companion_sign || '—')}
        </div>
        <div class="btn-group">
          <button class="btn success" data-answer="true">${ICONS.check} Доверяю</button>
          <button class="btn danger" data-answer="false">${ICONS.x} Не доверяю</button>
        </div>
      </div>
    `;

    modal.querySelectorAll('button[data-answer]').forEach(btn => {
      btn.onclick = () => {
        this.answerRequest(req.request_id, btn.dataset.answer === 'true');
        modal.remove();
        this.pendingRequests.delete(req.request_id);
      };
    });

    document.getElementById('modalContainer').appendChild(modal);
  }

  showRequestDataModal(req) {
    if (this.pendingRequests.has(req.request_id)) return;
    this.pendingRequests.set(req.request_id, req);

    const isBool = req.data_type === 'bool';
    const modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
      <div class="modal">
        <h3>${ICONS.doc} Запрос данных</h3>
        <div class="prompt">${escapeHtml(req.prompt)}</div>
        <p><small>Тип: <code>${escapeHtml(req.data_type)}</code></small></p>
        ${isBool ? `
          <div class="btn-group">
            <button class="btn success" data-answer="true">${ICONS.check} Да / True</button>
            <button class="btn danger" data-answer="false">${ICONS.x} Нет / False</button>
          </div>
        ` : `
          <input type="text" id="reqInput_${req.request_id}" placeholder="Значение">
          <button class="btn" data-submit="1">Отправить</button>
        `}
      </div>
    `;

    if (isBool) {
      modal.querySelectorAll('button[data-answer]').forEach(btn => {
        btn.onclick = () => {
          this.answerRequest(req.request_id, btn.dataset.answer === 'true');
          modal.remove();
          this.pendingRequests.delete(req.request_id);
        };
      });
    } else {
      const input = modal.querySelector('input');
      const submit = modal.querySelector('button[data-submit]');
      const doSubmit = () => {
        let value = input.value;
        if (req.data_type === 'int') value = parseInt(value, 10);
        else if (req.data_type === 'float') value = parseFloat(value);
        this.answerRequest(req.request_id, value);
        modal.remove();
        this.pendingRequests.delete(req.request_id);
      };
      submit.onclick = doSubmit;
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSubmit(); });
      setTimeout(() => input.focus(), 100);
    }

    document.getElementById('modalContainer').appendChild(modal);
  }

  answerRequest(requestId, value) {
    if (this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify({ type: 'answer', request_id: requestId, value }));
    }
  }

  showToast(text, type = 'info') {
    const c = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const icon = type === 'error' ? ICONS.x : type === 'success' ? ICONS.check : ICONS.info;
    el.innerHTML = icon + '<span>' + escapeHtml(text) + '</span>';
    c.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

const fmtEditor = document.getElementById('fmtEditor');
const fmtToolbar = document.querySelector('.fmt-toolbar');

try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
try { document.execCommand('styleWithCSS', false, false); } catch (e) {}

function fmtEsc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]);
}

function fmtAnchorEl() {
  const sel = getSelection();
  if (!sel.rangeCount) return null;
  let n = sel.anchorNode;
  if (!n) return null;
  const el = n.nodeType === 1 ? n : n.parentElement;
  return el && fmtEditor.contains(el) ? el : null;
}

function fmtExec(cmd, val) {
  fmtEditor.focus();
  document.execCommand(cmd, false, val);
  fmtRefreshActive();
}

function fmtToggleBlock(tag) {
  const el = fmtAnchorEl();
  const cur = el && el.closest('h1,h2,h3,blockquote,pre');
  fmtExec('formatBlock', cur && cur.tagName.toLowerCase() === tag ? 'p' : tag);
}

function fmtFindCode(range) {
  const nodes = [range.startContainer, range.endContainer, range.commonAncestorContainer];
  for (const n of nodes) {
    const el = n.nodeType === 1 ? n : n.parentElement;
    const c = el && el.closest('code');
    if (c && fmtEditor.contains(c)) return c;
  }
  let found = null;
  fmtEditor.querySelectorAll('code').forEach(c => {
    if (found) return;
    try { if (range.intersectsNode(c)) found = c; } catch (e) {}
  });
  return found;
}

function fmtToggleCode() {
  fmtEditor.focus();
  const sel = getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const codeEl = fmtFindCode(range);
  if (codeEl) {
    const parent = codeEl.parentNode;
    while (codeEl.firstChild) parent.insertBefore(codeEl.firstChild, codeEl);
    parent.removeChild(codeEl);
    parent.normalize();
    fmtRefreshActive();
    return;
  }
  if (sel.isCollapsed) { fmtRefreshActive(); return; }
  const code = document.createElement('code');
  try {
    range.surroundContents(code);
  } catch (e) {
    code.appendChild(range.extractContents());
    range.insertNode(code);
  }
  fmtRefreshActive();
}

const fmtLinkModal = document.createElement('div');
fmtLinkModal.className = 'fmt-modal-backdrop';
fmtLinkModal.innerHTML =
  '<div class="fmt-modal">' +
  '<div class="fmt-modal-title">Ссылка</div>' +
  '<input type="text" placeholder="https://..." />' +
  '<div class="fmt-modal-actions">' +
  '<button class="fmt-btn" type="button">OK</button>' +
  '<button class="fmt-btn secondary" type="button">Отмена</button>' +
  '</div></div>';
document.body.appendChild(fmtLinkModal);
const fmtLinkInput = fmtLinkModal.querySelector('input');
const fmtLinkOk = fmtLinkModal.querySelector('.fmt-modal-actions .fmt-btn');
const fmtLinkCancel = fmtLinkModal.querySelector('.fmt-modal-actions .secondary');
let fmtSavedRange = null;

function fmtInsertLink() {
  const sel = getSelection();
  fmtSavedRange = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  const selText = sel.toString().trim();
  fmtLinkInput.value = /^https?:\/\//.test(selText) ? selText : 'https://';
  fmtLinkModal.classList.add('show');
  fmtLinkInput.focus();
  fmtLinkInput.select();
}

function fmtCloseLink(restore) {
  fmtLinkModal.classList.remove('show');
  fmtEditor.focus();
  if (restore && fmtSavedRange) {
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(fmtSavedRange);
  }
  fmtSavedRange = null;
}

function fmtApplyLink() {
  const url = fmtLinkInput.value.trim();
  fmtCloseLink(true);
  if (!url) { fmtRefreshActive(); return; }
  const selText = getSelection().toString().trim();
  if (selText) {
    document.execCommand('createLink', false, url);
  } else {
    document.execCommand('insertHTML', false, '<a href="' + fmtEsc(url) + '">' + fmtEsc(url) + '</a>');
  }
  fmtRefreshActive();
}

fmtLinkOk.addEventListener('click', fmtApplyLink);
fmtLinkCancel.addEventListener('click', () => fmtCloseLink(true));
fmtLinkModal.addEventListener('mousedown', e => { if (e.target === fmtLinkModal) fmtCloseLink(true); });
fmtLinkInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); fmtApplyLink(); }
  if (e.key === 'Escape') { e.preventDefault(); fmtCloseLink(true); }
});

const fmtPicker = document.createElement('div');
fmtPicker.className = 'fmt-tbl-picker';
fmtPicker.innerHTML = '<div class="fmt-tbl-grid"></div><div class="fmt-tbl-label">1 x 1</div>';
document.body.appendChild(fmtPicker);
const fmtGrid = fmtPicker.querySelector('.fmt-tbl-grid');
const fmtPlabel = fmtPicker.querySelector('.fmt-tbl-label');
let pkCols = 1, pkRows = 1;
for (let r = 1; r <= 8; r++) {
  for (let c = 1; c <= 10; c++) {
    const cell = document.createElement('div');
    cell.className = 'fmt-tbl-cell';
    cell.dataset.c = c;
    cell.dataset.r = r;
    fmtGrid.appendChild(cell);
  }
}
function fmtPaintPicker() {
  fmtGrid.querySelectorAll('.fmt-tbl-cell').forEach(el => {
    el.classList.toggle('hl', +el.dataset.c <= pkCols && +el.dataset.r <= pkRows);
  });
  fmtPlabel.textContent = pkCols + ' x ' + pkRows;
}
fmtPaintPicker();
fmtGrid.addEventListener('mouseover', e => {
  const c = e.target.closest('.fmt-tbl-cell');
  if (!c) return;
  pkCols = +c.dataset.c;
  pkRows = +c.dataset.r;
  fmtPaintPicker();
});
fmtGrid.addEventListener('mousedown', e => e.preventDefault());
fmtGrid.addEventListener('click', e => {
  const c = e.target.closest('.fmt-tbl-cell');
  if (!c) return;
  fmtInsertTable(pkCols, pkRows);
  fmtPicker.classList.remove('show');
});
document.addEventListener('click', e => {
  if (!e.target.closest('.fmt-tbl-picker') && !e.target.closest('[data-cmd="table"]')) {
    fmtPicker.classList.remove('show');
  }
});

function fmtTogglePicker(btn) {
  if (fmtPicker.classList.contains('show')) { fmtPicker.classList.remove('show'); return; }
  fmtPicker.classList.add('show');
  const r = btn.getBoundingClientRect();
  let left = r.left;
  const maxW = fmtPicker.offsetWidth;
  if (left + maxW > innerWidth - 8) left = innerWidth - maxW - 8;
  if (left < 8) left = 8;
  fmtPicker.style.left = left + 'px';
  fmtPicker.style.top = (r.bottom + 6) + 'px';
}

function fmtInsertTable(cols, rows) {
  fmtEditor.focus();
  const el = fmtAnchorEl();
  const inTable = el && el.closest('table');
  if (inTable) {
    const range = document.createRange();
    range.setStartAfter(inTable);
    range.collapse(true);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  let html = '<table><thead><tr>' + '<th><br></th>'.repeat(cols) + '</tr></thead><tbody>';
  for (let i = 0; i < Math.max(1, rows - 1); i++) html += '<tr>' + '<td><br></td>'.repeat(cols) + '</tr>';
  html += '</tbody></table><p><br></p>';
  document.execCommand('insertHTML', false, html);
  fmtRefreshActive();
}

function fmtMakeTool(sign, title, minus) {
  const b = document.createElement('button');
  b.className = 'fmt-tbl-tool' + (minus ? ' minus' : '');
  b.title = title;
  b.textContent = sign;
  document.body.appendChild(b);
  return b;
}
const fmtToolRowP = fmtMakeTool('+', 'Добавить строку', false);
const fmtToolRowM = fmtMakeTool('-', 'Удалить строку', true);
const fmtToolColP = fmtMakeTool('+', 'Добавить столбец', false);
const fmtToolColM = fmtMakeTool('-', 'Удалить столбец', true);
const fmtToolDel = fmtMakeTool('×', 'Удалить таблицу', true);
const fmtToolBtns = [fmtToolRowP, fmtToolRowM, fmtToolColP, fmtToolColM, fmtToolDel];
let fmtCurTable = null;

function fmtShowTools(tbl) {
  fmtCurTable = tbl;
  const r = tbl.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  fmtToolColP.style.left = (r.right - 9) + 'px';
  fmtToolColP.style.top = (cy - 20) + 'px';
  fmtToolColM.style.left = (r.right - 9) + 'px';
  fmtToolColM.style.top = (cy + 2) + 'px';
  fmtToolRowP.style.left = (cx - 20) + 'px';
  fmtToolRowP.style.top = (r.bottom - 8) + 'px';
  fmtToolRowM.style.left = (cx + 2) + 'px';
  fmtToolRowM.style.top = (r.bottom - 8) + 'px';
  fmtToolDel.style.left = (cx - 9) + 'px';
  fmtToolDel.style.top = (r.top - 9) + 'px';
  fmtToolBtns.forEach(b => b.classList.add('show'));
}
function fmtHideTools() {
  fmtCurTable = null;
  fmtToolBtns.forEach(b => b.classList.remove('show'));
}
document.addEventListener('mouseover', e => {
  if (e.target.closest('.fmt-tbl-tool')) return;
  const tbl = e.target.closest('table');
  if (tbl && fmtEditor.contains(tbl)) fmtShowTools(tbl);
  else fmtHideTools();
});
fmtEditor.addEventListener('scroll', fmtHideTools);

fmtToolRowP.addEventListener('click', () => {
  if (!fmtCurTable) return;
  const cols = fmtCurTable.rows[0] ? fmtCurTable.rows[0].cells.length : 1;
  const tr = fmtCurTable.insertRow(-1);
  for (let i = 0; i < cols; i++) tr.insertCell(-1).innerHTML = '<br>';
  fmtShowTools(fmtCurTable);
});
fmtToolRowM.addEventListener('click', () => {
  if (!fmtCurTable || fmtCurTable.rows.length < 2) return;
  fmtCurTable.deleteRow(fmtCurTable.rows.length - 1);
  fmtShowTools(fmtCurTable);
});
fmtToolColP.addEventListener('click', () => {
  if (!fmtCurTable) return;
  for (const tr of fmtCurTable.rows) {
    const cell = document.createElement(tr.parentElement.tagName === 'THEAD' ? 'th' : 'td');
    cell.innerHTML = '<br>';
    tr.appendChild(cell);
  }
  fmtShowTools(fmtCurTable);
});
fmtToolColM.addEventListener('click', () => {
  if (!fmtCurTable || !fmtCurTable.rows[0] || fmtCurTable.rows[0].cells.length < 2) return;
  for (const tr of fmtCurTable.rows) tr.deleteCell(tr.cells.length - 1);
  fmtShowTools(fmtCurTable);
});
fmtToolDel.addEventListener('click', () => {
  if (!fmtCurTable) return;
  fmtCurTable.remove();
  fmtEditor.focus();
  fmtHideTools();
});

function fmtSetOn(cmd, v) {
  const btn = fmtToolbar.querySelector('[data-cmd="' + cmd + '"]');
  if (btn) btn.classList.toggle('on', !!v);
}

function fmtRefreshActive() {
  const q = c => { try { return document.queryCommandState(c); } catch (e) { return false; } };
  fmtSetOn('bold', q('bold'));
  fmtSetOn('italic', q('italic'));
  fmtSetOn('underline', q('underline'));
  fmtSetOn('strike', q('strikeThrough'));
  fmtSetOn('ul', q('insertUnorderedList'));
  fmtSetOn('ol', q('insertOrderedList'));
  const el = fmtAnchorEl();
  fmtSetOn('code', !!(el && el.closest('code')));
  fmtSetOn('codeblock', !!(el && el.closest('pre')));
  fmtSetOn('link', !!(el && el.closest('a')));
  fmtSetOn('quote', !!(el && el.closest('blockquote')));
  fmtSetOn('h1', !!(el && el.closest('h1')));
  fmtSetOn('h2', !!(el && el.closest('h2')));
  fmtSetOn('h3', !!(el && el.closest('h3')));
}

const fmtActions = {
  bold: () => fmtExec('bold'),
  italic: () => fmtExec('italic'),
  underline: () => fmtExec('underline'),
  strike: () => fmtExec('strikeThrough'),
  code: fmtToggleCode,
  link: fmtInsertLink,
  codeblock: () => fmtToggleBlock('pre'),
  ul: () => fmtExec('insertUnorderedList'),
  ol: () => fmtExec('insertOrderedList'),
  table: () => fmtTogglePicker(fmtToolbar.querySelector('[data-cmd="table"]')),
  hr: () => fmtExec('insertHorizontalRule'),
  quote: () => fmtToggleBlock('blockquote'),
  h1: () => fmtToggleBlock('h1'),
  h2: () => fmtToggleBlock('h2'),
  h3: () => fmtToggleBlock('h3')
};

fmtToolbar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
fmtToolbar.addEventListener('click', e => {
  const btn = e.target.closest('button[data-cmd]');
  if (btn && fmtActions[btn.dataset.cmd]) fmtActions[btn.dataset.cmd]();
});

fmtEditor.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey && !e.shiftKey && e.code === 'KeyK') {
    e.preventDefault();
    fmtInsertLink();
  }
  if (mod && !e.altKey && !e.shiftKey && e.code === 'Enter') {
    e.preventDefault();
    if (window.ui) window.ui.sendMessage();
  }
});

fmtEditor.addEventListener('paste', e => {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
});

document.addEventListener('selectionchange', () => {
  if (fmtAnchorEl()) requestAnimationFrame(fmtRefreshActive);
});
fmtEditor.addEventListener('input', () => requestAnimationFrame(fmtRefreshActive));
fmtEditor.addEventListener('keyup', () => requestAnimationFrame(fmtRefreshActive));
fmtEditor.addEventListener('click', () => requestAnimationFrame(fmtRefreshActive));

fmtRefreshActive();

window.ui = new CryptoUI();
</script>
